<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Space Obsidian -->
    <linearGradient id="globeSpaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="50%" stop-color="#0A1226"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Glowing Rim -->
    <linearGradient id="globeSpaceBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- 3D Ocean Shading -->
    <radialGradient id="oceanSphere" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="85%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Glowing Land Continents -->
    <linearGradient id="landGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Equal Orbit Rings (Pure Neon Gold) -->
    <linearGradient id="equalOrbitGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#FACC15"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="globeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="globeShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- App Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#globeSpaceBg)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="url(#globeSpaceBorder)" stroke-width="3.5"/>

  <!-- Starry Space Field -->
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="90" cy="80" r="1.5"/>
    <circle cx="430" cy="110" r="2"/>
    <circle cx="80" cy="420" r="1.5"/>
    <circle cx="420" cy="400" r="1.5"/>
    <circle cx="256" cy="460" r="2"/>
    <circle cx="160" cy="60" r="1"/>
  </g>

  <!-- Ambient Outer Atmosphere Rim -->
  <circle cx="256" cy="256" r="162" fill="none" stroke="#38BDF8" stroke-width="12" opacity="0.15" filter="url(#globeGlow)"/>
  <circle cx="256" cy="256" r="156" fill="none" stroke="#00F2FE" stroke-width="2.5" opacity="0.7"/>

  <!-- 🌍 3D PLANET EARTH SPHERE -->
  <g filter="url(#globeShadow)">
    <circle cx="256" cy="256" r="150" fill="url(#oceanSphere)"/>

    <!-- Geometric Vector Continents (Clipped to Globe) -->
    <g clip-path="url(#globeClip)">
      <clipPath id="globeClip">
        <circle cx="256" cy="256" r="150"/>
      </clipPath>

      <!-- Eurasia & India Landmass Silhouette -->
      <path d="M 210,140 Q 250,130 290,150 Q 320,180 300,210 Q 280,240 260,230 Q 240,250 250,280 L 235,300 Q 220,280 230,250 Q 200,240 180,200 Z" 
            fill="url(#landGlow)" opacity="0.85"/>

      <!-- Americas Silhouette Edge -->
      <path d="M 120,160 Q 140,190 135,240 Q 120,280 140,320 L 125,350 Q 100,310 110,250 Z" 
            fill="url(#landGlow)" opacity="0.7"/>

      <!-- Latitude & Longitude Subtle Neon Grid -->
      <ellipse cx="256" cy="256" rx="150" ry="60" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.25"/>
      <ellipse cx="256" cy="256" rx="60" ry="150" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.25"/>
    </g>
  </g>

  <!-- 🌟 THE EQUAL ORBIT RINGS (=) ENCIRCLING THE GLOBE -->
  <g filter="url(#globeGlow)">
    <!-- Top Equal Ring -->
    <ellipse cx="256" cy="235" rx="195" ry="46" fill="none" stroke="url(#equalOrbitGold)" stroke-width="8" 
             transform="rotate(-15 256 235)"/>
    <!-- Bottom Equal Ring -->
    <ellipse cx="256" cy="275" rx="195" ry="46" fill="none" stroke="url(#equalOrbitGold)" stroke-width="8" 
             transform="rotate(-15 256 275)"/>
  </g>

  <!-- ✈️ SUPERSONIC JET RIDING THE TOP EQUAL ORBIT -->
  <g transform="translate(395, 175) rotate(-22) scale(0.95)" filter="url(#globeShadow)">
    <!-- Jet Afterburner Plume -->
    <ellipse cx="-45" cy="0" rx="26" ry="8" fill="#FACC15" filter="url(#globeGlow)"/>
    <!-- Wings -->
    <polygon points="-25,0 -50,-50 15,-6 10,0" fill="#FFFFFF"/>
    <polygon points="-25,0 -42,50 15,6 10,0" fill="#94A3B8"/>
    <!-- Fuselage Body -->
    <polygon points="50,0 -40,-12 -35,0 -40,12" fill="#F8FAFC"/>
    <!-- Cockpit -->
    <polygon points="18,0 2,-4 -7,0 2,4" fill="#00F2FE"/>
  </g>

  <!-- Destination Pin at the Top North of the Globe -->
  <g transform="translate(256, 108)" filter="url(#globeGlow)">
    <circle cx="0" cy="0" r="10" fill="#F43F5E"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
  </g>
</svg>
